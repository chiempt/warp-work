openapi: 3.0.3

info:
  title: Warp API
  version: 0.1.0
  description: |
    Warp's HTTP API. This document is the source of truth: the Go server
    interfaces and the frontend's TypeScript client are both generated from it,
    and a handler that drifts from it fails to compile.

    Two rules from CLAUDE.md are enforced by the contract itself rather than by
    convention:

    * **Every read is context-scoped.** `GET /signals` requires `contextIds`.
      There is no way to ask this API for everything at once.
    * **Raw payloads never leave the system.** A `Signal` carries its subject
      and snippet, never `payload` — that is other people's correspondence, and
      the timeline does not need it.

    **Two things here involve Google OAuth and must not be confused.** Signing in
    (`/auth/google/*`) proves the owner is themselves, asks only for
    `openid email profile`, and produces a short session tied to them being
    present. Connecting a mailbox writes to `accounts` instead, asks for Gmail
    and Calendar scopes, and produces a refresh token that must keep working
    unattended for months. Revoking a session must never stop the overnight sync.

    Scope is Phase 1 (*See*): authentication, contexts, accounts, and the signal
    timeline. Work items, work sessions, and proposed actions arrive with later
    phases.
  contact:
    name: Warp
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Local development

# Everything requires a session unless it says otherwise. The two sign-in
# endpoints override this with `security: []`, since requiring a session to
# obtain one would be a closed loop.
security:
  - sessionCookie: []

tags:
  - name: auth
    description: Signing in, and the sessions and sign-in methods that result.
  - name: contexts
    description: The life areas everything else hangs from.
  - name: accounts
    description: Connected sources of signals.
  - name: signals
    description: Immutable items as they arrived from the outside world.

paths:
  /api/v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create the owner account with an email and password
      description: |
        Warp has exactly one owner (see §2 of the context document). This
        endpoint therefore succeeds at most once: a second attempt is a 409,
        not a second account. It is not a public sign-up.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: The owner was created and is now signed in.
          headers:
            Set-Cookie:
              description: The session cookie — `HttpOnly`, `Secure`, `SameSite=Lax`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "409":
          description: An owner already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with an email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "401":
          description: |
            Wrong email or password. Deliberately one response for both, so the
            endpoint cannot be used to discover which addresses exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many failed attempts; the account is temporarily locked.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/google/start:
    get:
      operationId: startGoogleSignIn
      tags: [auth]
      summary: Begin signing in with Google
      description: |
        Redirects to Google. Sets a short-lived, `HttpOnly` state cookie that the
        callback checks, which is what stops a forged callback from signing
        someone in.

        Scopes are `openid email profile` only. This grants no access to mail or
        calendar — connecting those is a separate consent, and lives with
        `accounts`.
      security: []
      parameters:
        - name: returnTo
          in: query
          required: false
          description: |
            Where to land after signing in. A path within this application only:
            the pattern rejects an absolute URL and a protocol-relative `//host`,
            so this cannot become an open redirect.
          schema:
            type: string
            pattern: '^/([^/].*)?$'
            maxLength: 512
            default: /
      responses:
        "302":
          description: Redirect to Google's consent screen.
          headers:
            Location:
              required: true
              schema:
                type: string
            Set-Cookie:
              description: The `HttpOnly` state cookie.
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/google/callback:
    get:
      operationId: completeGoogleSignIn
      tags: [auth]
      summary: Finish signing in with Google
      description: |
        Where Google returns the browser. Verifies `state` against the cookie,
        exchanges `code`, and matches the resulting `sub` claim against
        `auth_providers`. Matching is on `sub`, never on the email address: an
        email can be reassigned at the provider, and matching on it would hand
        the account to whoever inherits it.

        An identity that is not already linked is rejected. There is exactly one
        owner, and sign-in does not create accounts.

        On success, sets the session cookie and redirects to `returnTo`.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Present when the owner declined at Google's consent screen.
          schema:
            type: string
      responses:
        "302":
          description: Signed in; redirecting into the application.
          headers:
            Location:
              required: true
              schema:
                type: string
            Set-Cookie:
              description: The session cookie — `HttpOnly`, `Secure`, `SameSite=Lax`.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/session:
    get:
      operationId: getCurrentSession
      tags: [auth]
      summary: Who is signed in, and on what
      responses:
        "200":
          description: The current session and the owner it belongs to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: signOut
      tags: [auth]
      summary: Sign out of this browser
      description: |
        Revokes this session only. Other browsers stay signed in — use
        `/auth/sessions/{sessionId}` to revoke one of those.
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              description: The session cookie, expired.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: Every browser currently signed in
      description: |
        Sessions are server-side precisely so this list can exist and be acted
        on. A lost laptop is revoked from here, without rotating anything.
      responses:
        "200":
          description: Live sessions, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      tags: [auth]
      summary: Revoke one session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked. Already-revoked sessions also return 204.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/providers:
    get:
      operationId: listAuthProviders
      tags: [auth]
      summary: The ways the owner can sign in
      description: |
        More than one is the point. A single way in is a single point of lockout,
        and there is no administrator to appeal to.
      responses:
        "200":
          description: Linked sign-in methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedProviderList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/providers/{providerId}:
    delete:
      operationId: unlinkAuthProvider
      tags: [auth]
      summary: Unlink a sign-in method
      description: |
        Refuses to remove the last one — that is an unrecoverable lockout, and
        the database enforces it as well as this endpoint.
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Unlinked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This is the only way in left.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/contexts:
    get:
      operationId: listContexts
      tags: [contexts]
      summary: List contexts
      description: |
        Returns the context tree, parents before children, then by position.
      parameters:
        - name: includeArchived
          in: query
          required: false
          description: Include archived contexts. Off by default.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The context tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextList"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/contexts/{contextId}:
    get:
      operationId: getContext
      tags: [contexts]
      summary: Get one context
      parameters:
        - $ref: "#/components/parameters/ContextId"
      responses:
        "200":
          description: The context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Context"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List connected accounts
      description: |
        Every account carries a `reliability` tier. A client must show it
        wherever it shows data derived from that account: a report generated
        while a source was failing is never silently trusted.
      parameters:
        - name: contextId
          in: query
          required: false
          description: Only accounts feeding this context.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The connected accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/signals:
    get:
      operationId: listSignals
      tags: [signals]
      summary: The signal timeline for one or more contexts
      description: |
        `contextIds` is required. There is deliberately no unfiltered signal
        listing: a client that could ask for everything would eventually show
        coursework during a client work session.

        Newest first, by the time the item actually occurred — not the time it
        was ingested, which is an artefact of when a sync last ran.
      parameters:
        - name: contextIds
          in: query
          required: true
          description: One or more context ids. At least one is required.
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items:
              type: string
              format: uuid
        - name: before
          in: query
          required: false
          description: Return signals that occurred strictly before this instant.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: A page of the timeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalList"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: warp_session
      description: |
        An opaque session token. The server stores only its hash, so a database
        dump is not enough to sign in. `HttpOnly`, so a scripting flaw in the
        dashboard cannot read it.

  parameters:
    ContextId:
      name: contextId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Error:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: No valid session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ErrorEnvelope:
      type: object
      description: |
        Every error this API returns has this shape, so a client has exactly one
        branch to write.
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable. Safe to switch on.
          example: not_found
        message:
          type: string
          description: |
            Human-readable and safe to display. Never contains payload
            contents, credentials, or anyone's correspondence.
          example: context not found
        details:
          type: object
          additionalProperties: true
          description: Structured detail, when there is any that is safe to return.

    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          description: |
            Length is the only rule the contract enforces. Composition rules
            push people towards predictable substitutions; length does not.
        displayName:
          type: string
          minLength: 1
          maxLength: 200

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          maxLength: 128

    AuthProviderKind:
      type: string
      description: |
        How a sign-in method authenticates. `zalo` and `facebook` are sign-in
        products distinct from their messaging APIs — linking one grants no
        access to messages.
      enum: [google, zalo, facebook, passkey, password]

    LinkedProvider:
      type: object
      required: [id, kind, isPrimary, linkedAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/AuthProviderKind"
        email:
          type: string
          description: |
            What the provider reported when this was linked. Display only — it
            is not what authenticates, and a passkey has none.
        isPrimary:
          type: boolean
        linkedAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true

    LinkedProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LinkedProvider"

    Session:
      type: object
      description: |
        A browser that is signed in. The token itself never appears here — only
        the server-side record of it.
      required: [id, issuedAt, lastSeenAt, expiresAt, isCurrent]
      properties:
        id:
          type: string
          format: uuid
        providerKind:
          $ref: "#/components/schemas/AuthProviderKind"
        issuedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        userAgent:
          type: string
          description: Enough to recognise which browser this is, and revoke the right one.
        ip:
          type: string
          nullable: true
        isCurrent:
          type: boolean
          description: True for the session making this request.

    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"

    SignedInUser:
      type: object
      required: [id, email, displayName, timezone]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          description: |
            The canonical address the owner declares. Not what authenticates
            them — sign-in matches on the provider's immutable subject.
        displayName:
          type: string
        timezone:
          type: string
          description: |
            Presentation only. Everything is stored and returned in UTC.
          example: Asia/Ho_Chi_Minh

    CurrentSession:
      type: object
      required: [user, session]
      properties:
        user:
          $ref: "#/components/schemas/SignedInUser"
        session:
          $ref: "#/components/schemas/Session"

    ContextKind:
      type: string
      enum: [work, study, personal]

    Context:
      type: object
      required: [id, slug, name, kind, position, isArchived, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Null for a root context. A child inherits its parent's defaults.
        slug:
          type: string
          example: job-a
        name:
          type: string
          example: Remote job A
        kind:
          $ref: "#/components/schemas/ContextKind"
        color:
          type: string
          nullable: true
        toneProfile:
          type: string
          description: How the system writes on the owner's behalf in this context.
        position:
          type: integer
          format: int32
          description: Display order among siblings.
        isArchived:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ContextList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Context"

    Reliability:
      type: string
      description: |
        How complete this source can be assumed to be. Only `official` may be
        presented as the whole picture.
      enum: [official, unofficial, manual]

    AccountStatus:
      type: string
      description: The account's health right now, as distinct from its reliability tier.
      enum: [connected, error, disconnected]

    Account:
      type: object
      required: [id, provider, reliability, displayName, status]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          example: gmail
        reliability:
          $ref: "#/components/schemas/Reliability"
        displayName:
          type: string
        status:
          $ref: "#/components/schemas/AccountStatus"
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          description: Empty when healthy. Never contains credentials.

    AccountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Account"

    SignalKind:
      type: string
      enum: [email, message, calendar_event, file]

    AssignedBy:
      type: string
      description: What decided this signal's placement, so a misfiling can be traced.
      enum: [rule, model, manual]

    Signal:
      type: object
      description: |
        A signal as the timeline shows it. `payload` is deliberately absent:
        the raw item stays in the database.
      required: [id, accountId, kind, occurredAt, ingestedAt, processed]
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/SignalKind"
        subject:
          type: string
        snippet:
          type: string
          description: A short excerpt, enough to recognise the item in a list.
        occurredAt:
          type: string
          format: date-time
          description: When the item actually happened, not when it was fetched.
        ingestedAt:
          type: string
          format: date-time
        processed:
          type: boolean
          description: Whether extraction has already run over this signal.
        contextId:
          type: string
          format: uuid
          description: The context this row was returned under.
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: How certain the placement is. Always 1 for a rule match.
        assignedBy:
          $ref: "#/components/schemas/AssignedBy"

    SignalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
