version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck   # a function doing I/O must accept and pass a context
    - errorlint      # errors.Is / errors.As instead of type assertions
    - goconst
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - wastedassign
  exclusions:
    paths:
      # Generated by sqlc; regenerate rather than lint.
      - internal/store
    rules:
      - path: _test\.go$
        linters:
          - goconst

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - internal/store
