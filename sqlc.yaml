version: "2"
sql:
  - engine: postgresql
    # sqlc reads the same migration files goose applies, so the generated code
    # and the database cannot describe different schemas. It understands the
    # `-- +goose Down` marker and ignores the rollback statements.
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
